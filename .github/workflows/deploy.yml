name: Deploy to Firebase Hosting

on:
  pull_request:
    branches:
      - development

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env

      - name: Install dependencies
        run: |
          npm install
          npm list # List installed packages for debugging

      - name: Build project
        run: |
          npm run build
        env:
          CI: false # This prevents treating warnings as errors

      - name: Debug build output
        if: always()
        run: |
          ls -la dist/ || echo "dist directory not found"
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - name: Deploy to Firebase Hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: consulting-services-d0037
          target: online-consulting-beta

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🚀 Deployment successful! Live at: https://online-consulting-beta.web.app"

      - name: 💬 Comment on PR with Deployment URL
        if: success() && github.event_name == 'pull_request'
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
          -d '{"body": "🚀 Deployment successful! View it here: [LIVE SITE](https://online-consulting-beta.web.app)"}'
